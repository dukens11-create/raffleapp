# Codemagic CI/CD Configuration for Grate Genyen Raffle App
# 
# This configuration defines automated build workflows for Android, iOS, and development testing.
# 
# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
# 
# 1. ENVIRONMENT VARIABLES (Configure in Codemagic UI)
#    
#    Create variable groups in Codemagic dashboard:
#    
#    android_credentials group:
#    - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: For Google Play publishing
#    - FCI_KEYSTORE: Base64-encoded keystore file
#    - FCI_KEYSTORE_PASSWORD: Keystore password
#    - FCI_KEY_ALIAS: Key alias name
#    - FCI_KEY_PASSWORD: Key password
#    
#    ios_credentials group:
#    - APP_STORE_CONNECT_KEY_IDENTIFIER: API key ID
#    - APP_STORE_CONNECT_ISSUER_ID: Issuer ID
#    - APP_STORE_CONNECT_PRIVATE_KEY: Private key
#    - CERTIFICATE_PRIVATE_KEY: Certificate private key
#    
#    Common variables:
#    - API_BASE_URL: Set to https://grategenyen.com
#    
# 2. DOCUMENTATION
#    - Setup Guide: See flutter_app/CODEMAGIC_SETUP.md
#    - Codemagic YAML: https://docs.codemagic.io/yaml/yaml-getting-started/
#    - Flutter builds: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#    - Android signing: https://docs.codemagic.io/yaml-code-signing/signing-android/
#    - iOS signing: https://docs.codemagic.io/yaml-code-signing/signing-ios/
#    
# ============================================================================

workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - android_credentials
      vars:
        API_BASE_URL: "https://grategenyen.com"
        FCI_KEYSTORE_PATH: /tmp/keystore.jks
    scripts:
      - name: Set up keystore
        script: |
          echo $FCI_KEYSTORE | base64 --decode > $FCI_KEYSTORE_PATH
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages pub get
      - name: Patch qr_code_scanner dependency
        script: |
          cd flutter_app
          chmod +x scripts/patch_qr_code_scanner.sh
          ./scripts/patch_qr_code_scanner.sh
      - name: Build APK
        script: |
          cd flutter_app
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Build AAB
        script: |
          cd flutter_app
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - flutter_app/build/app/outputs/**/*.apk
      - flutter_app/build/app/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - dukens11@example.com  # Update with your email address
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      vars:
        API_BASE_URL: "https://grategenyen.com"
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages pub get
      - name: Patch qr_code_scanner dependency
        script: |
          cd flutter_app
          chmod +x scripts/patch_qr_code_scanner.sh
          ./scripts/patch_qr_code_scanner.sh
      - name: Install CocoaPods dependencies
        script: |
          cd flutter_app/ios
          pod install
      - name: Build iOS
        script: |
          cd flutter_app
          flutter build ios --release --dart-define=API_BASE_URL=$API_BASE_URL --no-codesign
      - name: Build IPA
        script: |
          cd flutter_app
          flutter build ipa --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - flutter_app/build/ios/**/*.ipa
    publishing:
      email:
        recipients:
          - dukens11@example.com  # Update with your email address
      app_store_connect:
        api_key: $APP_STORE_CONNECT_KEY_IDENTIFIER

  development-workflow:
    name: Development Build
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://grategenyen.com"
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages pub get
      - name: Patch qr_code_scanner dependency
        script: |
          cd flutter_app
          chmod +x scripts/patch_qr_code_scanner.sh
          ./scripts/patch_qr_code_scanner.sh
      - name: Run tests
        script: |
          cd flutter_app
          flutter test
      - name: Build APK (debug)
        script: |
          cd flutter_app
          flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - flutter_app/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - dukens11@example.com  # Update with your email address
