name: raffle_app
description: A Flutter mobile app for Grate Genyen raffle ticket management system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  
  # Scratch Card
  scratcher: ^2.5.0
  
  # State Management
  provider: ^6.1.1
  
  # Network & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Camera & Image
  image_picker: ^1.0.5
  camera: ^0.10.5+7
  
  # QR/Barcode Scanning
  qr_code_scanner:
    path: ../local_plugins/qr_code_scanner
  mobile_scanner: ^3.5.5
  
  # Payment Integration
  flutter_stripe: ^10.1.0
  
  # UI Helpers
  intl: ^0.18.1
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  uuid: ^4.2.2
  
  # Charts & Analytics
  fl_chart: ^0.65.0
  
  # Navigation
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
