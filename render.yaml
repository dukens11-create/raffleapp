services:
  - type: web
    name: raffle-app
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: raffle-app
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
    autoDeploy: true
