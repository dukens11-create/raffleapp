<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration - Grate Genyen</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Grate Genyen">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png">
    
    <!-- Standard Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-image {
            max-width: 200px;
            max-height: 80px;
            width: auto;
            height: auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        
        .file-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
            padding: 10px;
            border-radius: 5px;
        }
        
        #message.success {
            color: #10b981;
            background-color: #d1fae5;
        }
        
        #message.error {
            color: #ef4444;
            background-color: #fee2e2;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .logo-image {
                max-width: 160px;
                max-height: 64px;
            }
        }
        /* Language Selector Styles */
        .language-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .lang-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 24px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            width: auto;
            min-height: 40px;
        }
        
        .lang-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.1);
        }
        
        .lang-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <!-- Language Selector -->
    <div class="language-selector">
        <button class="lang-btn" data-lang="en" title="English" aria-label="Switch to English">🇺🇸</button>
        <button class="lang-btn" data-lang="ht" title="Kreyòl Ayisyen" aria-label="Switch to Haitian Creole">🇭🇹</button>
        <button class="lang-btn" data-lang="fr" title="Français" aria-label="Switch to French">🇫🇷</button>
    </div>
    
    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <img src="/logo.png" alt="Grate Genyen Logo" class="logo-image">
        </div>
        
        <!-- Heading -->
        <h1 data-translate="pageTitle">Become a Seller</h1>
        <p class="subtitle" data-translate="subtitle">Request access to sell raffle tickets</p>
        
        <form id="sellerRegistrationForm">
            <div class="form-group">
                <label for="fullName" data-translate="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required data-translate-placeholder="fullNamePlaceholder" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="phone" data-translate="phoneNumber">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required data-translate-placeholder="phonePlaceholder" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label for="email" data-translate="email">Email Address *</label>
                <input type="email" id="email" name="email" required data-translate-placeholder="emailPlaceholder" placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label for="address" data-translate="address">Address *</label>
                <input type="text" id="address" name="address" required data-translate-placeholder="addressPlaceholder" placeholder="Enter your address">
            </div>
            <div class="form-group">
                <label for="idPicture" data-translate="idPicture">Front ID Picture *</label>
                <input type="file" id="idPicture" name="idPicture" accept="image/*" required>
                <div class="file-info" data-translate="idPictureInfo">Please upload a clear photo of the front of your ID (JPEG, PNG, or similar)</div>
            </div>
            <button type="submit" id="submitBtn" data-translate="submitRequest">Submit Request</button>
            <div id="message"></div>
        </form>
        
        <div class="login-link">
            <p><span data-translate="alreadyHaveAccess">Already have access?</span> <a href="/login.html" data-translate="loginHere">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('sellerRegistrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;
            const idPictureFile = document.getElementById('idPicture').files[0];
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            // Validate file
            if (!idPictureFile) {
                messageDiv.textContent = 'Please select an ID picture';
                messageDiv.className = 'error';
                return;
            }
            
            // Check file size (max 5MB)
            if (idPictureFile.size > 5 * 1024 * 1024) {
                messageDiv.textContent = 'ID picture must be less than 5MB';
                messageDiv.className = 'error';
                return;
            }
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            
            try {
                // Create FormData for file upload
                const formData = new FormData();
                formData.append('fullName', fullName);
                formData.append('phone', phone);
                formData.append('email', email);
                formData.append('address', address);
                formData.append('idPicture', idPictureFile);
                
                const response = await fetch('/api/seller-registration', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'success';
                    // Reset form
                    document.getElementById('sellerRegistrationForm').reset();
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    messageDiv.textContent = data.error || 'Registration failed. Please try again.';
                    messageDiv.className = 'error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Request';
                }
            } catch (error) {
                messageDiv.textContent = 'Connection error. Please try again.';
                messageDiv.className = 'error';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Request';
            }
        });
    </script>
    
    <!-- Language Translation Script -->
    <script>
        // Comprehensive translations for seller registration page
        const translations = {
            en: {
                pageTitle: "Become a Seller",
                subtitle: "Request access to sell raffle tickets",
                fullName: "Full Name *",
                fullNamePlaceholder: "Enter your full name",
                phoneNumber: "Phone Number *",
                phonePlaceholder: "Enter your phone number",
                email: "Email Address *",
                emailPlaceholder: "Enter your email address",
                address: "Address *",
                addressPlaceholder: "Enter your address",
                idPicture: "Front ID Picture *",
                idPictureInfo: "Please upload a clear photo of the front of your ID (JPEG, PNG, or similar)",
                submitRequest: "Submit Request",
                submitting: "Submitting...",
                alreadyHaveAccess: "Already have access?",
                loginHere: "Login here",
                // Messages
                successMessage: "Request submitted successfully! Redirecting to login...",
                errorMessage: "Registration failed. Please try again.",
                connectionError: "Connection error. Please try again."
            },
            ht: {
                pageTitle: "Vin yon Vandè",
                subtitle: "Mande aksè pou vann tikè rif",
                fullName: "Non Konplè *",
                fullNamePlaceholder: "Antre non konplè ou",
                phoneNumber: "Nimewo Telefòn *",
                phonePlaceholder: "Antre nimewo telefòn ou",
                email: "Adrès Imèl *",
                emailPlaceholder: "Antre adrès imèl ou",
                address: "Adrès *",
                addressPlaceholder: "Antre adrès ou",
                idPicture: "Foto Devan Kat Idantite *",
                idPictureInfo: "Tanpri voye yon foto klè devan kat idantite ou (JPEG, PNG, oswa menm jan)",
                submitRequest: "Soumèt Demann",
                submitting: "Ap soumèt...",
                alreadyHaveAccess: "Ou deja gen aksè?",
                loginHere: "Konekte isit la",
                // Messages
                successMessage: "Demann soumèt avèk siksè! Ap redirije nan login...",
                errorMessage: "Enskripsyon echwe. Tanpri eseye ankò.",
                connectionError: "Erè koneksyon. Tanpri eseye ankò."
            },
            fr: {
                pageTitle: "Devenir un Vendeur",
                subtitle: "Demander l'accès pour vendre des billets de tombola",
                fullName: "Nom Complet *",
                fullNamePlaceholder: "Entrez votre nom complet",
                phoneNumber: "Numéro de Téléphone *",
                phonePlaceholder: "Entrez votre numéro de téléphone",
                email: "Adresse E-mail *",
                emailPlaceholder: "Entrez votre adresse e-mail",
                address: "Adresse *",
                addressPlaceholder: "Entrez votre adresse",
                idPicture: "Photo Recto de la Carte d'Identité *",
                idPictureInfo: "Veuillez télécharger une photo claire du recto de votre carte d'identité (JPEG, PNG ou similaire)",
                submitRequest: "Soumettre la Demande",
                submitting: "Soumission...",
                alreadyHaveAccess: "Vous avez déjà accès?",
                loginHere: "Connectez-vous ici",
                // Messages
                successMessage: "Demande soumise avec succès! Redirection vers la connexion...",
                errorMessage: "Échec de l'inscription. Veuillez réessayer.",
                connectionError: "Erreur de connexion. Veuillez réessayer."
            }
        };
        
        // Get current language from localStorage or default to English
        function getCurrentLanguage() {
            return localStorage.getItem('raffleAppLanguage') || 'en';
        }
        
        // Set language
        function setLanguage(lang) {
            localStorage.setItem('raffleAppLanguage', lang);
            
            // Update all elements with data-translate attribute
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            
            // Update placeholders
            document.querySelectorAll('[data-translate-placeholder]').forEach(element => {
                const key = element.getAttribute('data-translate-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // Initialize language on page load
        document.addEventListener('DOMContentLoaded', () => {
            const currentLang = getCurrentLanguage();
            setLanguage(currentLang);
        });
        
        // Add click handlers for language buttons
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                setLanguage(lang);
            });
        });
        
        // Override form submit button text with translations
        const form = document.getElementById('sellerRegistrationForm');
        const originalSubmitHandler = form.onsubmit;
        
        form.addEventListener('submit', function() {
            const currentLang = getCurrentLanguage();
            const submitBtn = document.getElementById('submitBtn');
            
            // Update button text during submission
            setTimeout(() => {
                if (submitBtn.disabled) {
                    submitBtn.textContent = translations[currentLang].submitting;
                }
            }, 0);
        }, true);
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registered:', registration);
                    })
                    .catch((error) => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
