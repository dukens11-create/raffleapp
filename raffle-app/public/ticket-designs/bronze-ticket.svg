<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bronzeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <pattern id="sparkle" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="white" opacity="0.3"/>
      <circle cx="15" cy="10" r="1.5" fill="white" opacity="0.5"/>
      <circle cx="8" cy="15" r="1" fill="white" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background with sparkle -->
  <rect width="400" height="600" fill="url(#bronzeBg)"/>
  <rect width="400" height="600" fill="url(#sparkle)"/>
  
  <!-- Top Banner -->
  <rect x="0" y="0" width="400" height="60" fill="#8b4513"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">GRATE TOUT</text>
  <text x="380" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="end">250 GOURDES</text>
  
  <!-- Logo Section -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fbbf24" text-anchor="middle">GRATE</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#38bdf8" text-anchor="middle">GENYEN</text>
  
  <!-- Category Ribbon -->
  <ellipse cx="200" cy="250" rx="120" ry="40" fill="#6b7280" opacity="0.9"/>
  <text x="200" y="262" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">BRONZE</text>
  
  <!-- Scratch Area -->
  <rect x="100" y="320" width="200" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Scratch to Reveal</text>
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">JKL-######</text>
  
  <!-- Bottom Banner -->
  <rect x="0" y="540" width="400" height="60" fill="#8b4513"/>
  <text x="200" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">GRATE &amp; GENYEN JISKA</text>
  <text x="200" y="585" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">25,000 GOURDES!</text>
</svg>
